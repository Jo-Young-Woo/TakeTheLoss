# OAK-D Lite 컬러 전용 저전력 프로파일 — 보조 탐지(oak_det)용. 기본 프로파일(oak.profile: rgb_lowpower).   [실기 확인]
#
# depthai_ros_driver 의 파라미터 이름은 판마다 다르다. 이 파일은 구 문서 이름으로 썼다. 로봇에 깔린 판의 이름은
#   ros2 pkg xml depthai_ros_driver | grep version     ros2 param list /oak
# 로 확인하고 다르면 아래 대응표대로 고친다.
#
#   구 문서 (이 파일)                         v3 문서
#   camera.i_pipeline_type                   pipeline_gen.i_pipeline_type
#   rgb.i_resolution + i_isp_num / i_isp_den rgb.i_width / rgb.i_height
#   stereo.i_align_depth                     stereo.i_aligned
#   camera.i_nn_type / camera.i_enable_imu   (같은 이름이 많다; 안 맞으면 param list 로 찾는다)
#   rgb.i_fps / stereo.i_fps                 같음
#
# 전력: 기본+스트리밍 2.5–3 W 에 스테레오 +0.5 W, 인코딩 +0.5 W, AI +1 W 가 더해진다 → 필요한 스트림만 켠다(여기서는 컬러만).
# 컬러 1280×720 = 1080p(1920×1080) 의 ISP 2/3. 640 폭으로 줄이는 일은 oak_det 가 필요할 때 소프트웨어로 한다.
/oak:
  ros__parameters:
    camera:
      i_pipeline_type: RGB         # 컬러만. 스테레오·깊이 스트림 없음
      i_nn_type: none              # 장치(VPU) 신경망 끔 — YOLO 는 Jetson 에서 돈다
      i_enable_imu: false          # OAK 의 IMU(BMI270)는 끈다 — 로봇 IMU(/imu/data)를 쓴다
    rgb:
      i_fps: 10.0                  # 10 fps 이하(보조 탐지는 최대 3 Hz 로만 쓴다)
      i_resolution: "1080"
      i_set_isp_scale: true
      i_isp_num: 2
      i_isp_den: 3                 # 1920×1080 × 2/3 = 1280×720
      i_output_isp: true
      i_low_bandwidth: false       # 압축 끔 (JPEG/H.264 인코딩은 전력 +0.5 W)
      i_publish_topic: true
