# 자동 생성 파일 — 직접 고치지 말고 calib/robot_profile.yaml 을 고친 뒤 scripts/calib_generate.py 를 다시 실행
# 프로파일에 아직 '가정(assumed)'인 값 69개 (scripts/calib_report.py 로 목록 확인)
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names: [nav2_compute_path_to_pose_action_bt_node, nav2_follow_path_action_bt_node,
      nav2_spin_action_bt_node, nav2_wait_action_bt_node, nav2_back_up_action_bt_node,
      nav2_clear_costmap_service_bt_node, nav2_is_stuck_condition_bt_node, nav2_goal_reached_condition_bt_node,
      nav2_goal_updated_condition_bt_node, nav2_initial_pose_received_condition_bt_node,
      nav2_rate_controller_bt_node, nav2_distance_controller_bt_node, nav2_speed_controller_bt_node,
      nav2_truncate_path_action_bt_node, nav2_goal_updater_node_bt_node, nav2_recovery_node_bt_node,
      nav2_pipeline_sequence_bt_node, nav2_round_robin_node_bt_node, nav2_transform_available_condition_bt_node,
      nav2_time_expired_condition_bt_node, nav2_distance_traveled_condition_bt_node,
      nav2_single_trigger_bt_node, nav2_navigate_to_pose_action_bt_node, nav2_remove_passed_goals_action_bt_node,
      nav2_planner_selector_bt_node, nav2_controller_selector_bt_node, nav2_goal_checker_selector_bt_node,
      nav2_controller_cancel_bt_node, nav2_wait_cancel_bt_node, nav2_spin_cancel_bt_node,
      nav2_back_up_cancel_bt_node, nav2_compute_path_through_poses_action_bt_node,
      nav2_drive_on_heading_bt_node, nav2_drive_on_heading_cancel_bt_node, nav2_progress_checker_selector_bt_node,
      nav2_smooth_path_action_bt_node, nav2_smoother_selector_bt_node, nav2_goal_updated_controller_bt_node,
      nav2_is_path_valid_condition_bt_node, nav2_get_pose_from_path_action_bt_node,
      nav2_globally_updated_goal_condition_bt_node, nav2_truncate_path_local_action_bt_node]
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker: {plugin: 'nav2_controller::SimpleProgressChecker', required_movement_radius: 0.1,
      movement_time_allowance: 8.0}
    general_goal_checker: {stateful: true, plugin: 'nav2_controller::SimpleGoalChecker',
      xy_goal_tolerance: 0.08, yaw_goal_tolerance: 6.3}
    FollowPath: {plugin: 'nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController',
      desired_linear_vel: 0.338, lookahead_dist: 0.371, min_lookahead_dist: 0.25,
      max_lookahead_dist: 0.7, lookahead_time: 1.5, rotate_to_heading_angular_vel: 1.54,
      transform_tolerance: 0.2, use_velocity_scaled_lookahead_dist: false, min_approach_linear_velocity: 0.068,
      approach_velocity_scaling_dist: 0.5, use_collision_detection: true, max_allowed_time_to_collision_up_to_carrot: 1.0,
      use_regulated_linear_velocity_scaling: true, use_cost_regulated_linear_velocity_scaling: true,
      regulated_linear_scaling_min_radius: 0.4, regulated_linear_scaling_min_speed: 0.101,
      use_rotate_to_heading: true, rotate_to_heading_min_angle: 0.6, allow_reversing: false,
      max_angular_accel: 8.0}
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 2
      height: 2
      resolution: 0.05
      robot_radius: 0.12
      plugins: [obstacle_layer, inflation_layer]
      filters: [own_base_keepout]
      own_base_keepout: {plugin: 'nav2_costmap_2d::KeepoutFilter', enabled: true,
        filter_info_topic: /own_base_keepout_info}
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan depth_obstacles
        scan: {topic: /scan, data_type: LaserScan, max_obstacle_height: 2.0, clearing: true,
          marking: true, obstacle_max_range: 4.0, raytrace_max_range: 5.0, obstacle_min_range: 0.0,
          raytrace_min_range: 0.0}
        depth_obstacles: {topic: /depth_obstacles_cloud, data_type: PointCloud2, min_obstacle_height: -1.0,
          max_obstacle_height: 2.0, clearing: false, marking: true, obstacle_max_range: 50.0,
          obstacle_min_range: 0.0, observation_persistence: 0.0, expected_update_rate: 0.0}
      inflation_layer: {plugin: 'nav2_costmap_2d::InflationLayer', cost_scaling_factor: 8.0,
        inflation_radius: 0.3}
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: false
      origin_x: -7.0
      origin_y: -7.0
      width: 14
      height: 14
      resolution: 0.05
      track_unknown_space: false
      robot_radius: 0.12
      plugins: [obstacle_layer, inflation_layer]
      filters: [own_base_keepout]
      own_base_keepout: {plugin: 'nav2_costmap_2d::KeepoutFilter', enabled: true,
        filter_info_topic: /own_base_keepout_info}
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan virtual_walls depth_obstacles
        depth_obstacles: {topic: /depth_obstacles_cloud, data_type: PointCloud2, min_obstacle_height: -1.0,
          max_obstacle_height: 2.0, clearing: false, marking: true, obstacle_max_range: 50.0,
          obstacle_min_range: 0.0, observation_persistence: 0.0, expected_update_rate: 0.0}
        scan: {topic: /scan, data_type: LaserScan, max_obstacle_height: 2.0, clearing: true,
          marking: true, obstacle_max_range: 6.0, raytrace_max_range: 7.0, obstacle_min_range: 0.0,
          raytrace_min_range: 0.0}
        virtual_walls: {topic: /arena_walls_cloud, data_type: PointCloud2, min_obstacle_height: -1.0,
          max_obstacle_height: 2.0, clearing: false, marking: true, obstacle_max_range: 50.0,
          obstacle_min_range: 0.0, observation_persistence: 0.0, expected_update_rate: 0.0}
      inflation_layer: {plugin: 'nav2_costmap_2d::InflationLayer', cost_scaling_factor: 8.0,
        inflation_radius: 0.3}
      always_send_full_costmap: true
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased: {plugin: nav2_navfn_planner/NavfnPlanner, tolerance: 0.2, use_astar: true,
      allow_unknown: true}
behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin: {plugin: nav2_behaviors/Spin}
    backup: {plugin: nav2_behaviors/BackUp}
    drive_on_heading: {plugin: nav2_behaviors/DriveOnHeading}
    wait: {plugin: nav2_behaviors/Wait}
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.2
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 8.0
    node_names: [controller_server, planner_server, behavior_server, bt_navigator]
