# Nav2 파라미터 — ROS2 Humble 기준으로 작성. !! 로봇에서 아직 실행해 보지 못했다(검증 순서는 ros2/README.md).
# 파라미터 이름이 Humble 빌드와 다르면 `ros2 param list /controller_server` 등으로 확인해 고친다.
#
# 설계 원칙 (경기장 구조물이 실시간으로 바뀐다):
#  - SLAM(Cartographer/slam_toolbox)은 '위치(TF map→odom)'만 책임진다. SLAM 의 /map 은 Nav2 가 쓰지 않는다.
#    SLAM 지도는 옛 위치의 박스가 한동안 남을 수 있어(서브맵 누적) 계획에 쓰면 옮겨진 박스가 유령 장애물이 된다.
#  - 전역 비용지도는 LiDAR 마킹 + '레이캐스트 클리어링'(obstacle_layer)으로 만든다 → 박스가 옮겨지면 LiDAR가 그 자리를
#    통과해 보는 즉시 비워지고, 새로 놓이면 즉시 막힌다.
#  - 경기장 외벽은 maicon26 이 /arena_walls_cloud 로 알려준다(마킹 전용) → 벽 밖으로 경로를 짜지 않는다.
#  - 전역 계획은 2 Hz 로 다시 한다(behavior_trees/navigate_replan_fast.xml).
#  - 속도는 /cmd_vel_nav2 로 낸다(launch 에서 리맵). 최종 /cmd_vel 은 maicon26 Agent 가 안전 제한 후 보낸다.
#
# 풋프린트: 처음엔 실물 250x230 mm 직사각형으로 썼더니 WSL 시뮬에서 RPP/spin/backup 의 "collision ahead" 가 매치당 ~400회 나와 자주 멈췄다
# (직사각형 외접 0.17 이 계획기가 허용한 좁은 곳에서 걸림). 원형으로 바꾸면 76~250회로 줄었다(단일 실행, 편차 큼).
# 실기에서는 실제 통과 가능한 최소 반경을 재서 robot_radius 를 정할 것. 박스 사이 통로 최소 0.40 m → 인플레이션 반경 0.30 이하.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # default_nav_to_pose_bt_xml 은 launch 가 (fast_replan:=true 일 때) 절대경로로 넣는다.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      # 아래는 설치된 Nav2(apt, Humble)의 기본 NavigateThroughPoses BT 등을 로드하는 데 필요하다
      # (bt_navigator 는 시작 시 두 기본 BT 를 모두 읽는다 — WSL 실행에서 ComputePathThroughPoses 미인식으로 죽었음)
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_progress_checker_selector_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_smoother_selector_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_get_pose_from_path_action_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_truncate_path_local_action_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 8.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.08          # maicon26 의 최소 허용오차(거점 진입 0.10)보다 작게
      yaw_goal_tolerance: 6.3          # 자세는 무관(≥2π 면 무시)

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.35         # m/s — config.robot.v_max(0.45) 이하. 실측 후 조정
      lookahead_dist: 0.45
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.70
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.6
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.5
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true   # 좁은 통로에서 벽 가까이는 감속
      regulated_linear_scaling_min_radius: 0.4
      regulated_linear_scaling_min_speed: 0.12
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.6
      allow_reversing: false
      max_angular_accel: 4.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 2
      height: 2
      resolution: 0.05
      robot_radius: 0.12                # 원형 풋프린트: 계획기와 컨트롤러·복구 동작(충돌검사)이 같은 기준. 시뮬(충돌반경 0.14)에서 정한 값 — 실기는 실측
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          obstacle_max_range: 4.0
          raytrace_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0
        inflation_radius: 0.30
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: false
      # SLAM 의 map 원점은 보통 '시작 자세'라 경기장이 map 안에서 어느 방향·어디에 놓일지 시작 때까지 모른다.
      # 시작점에서 경기장 최대 대각선(약 7.9 m)이 닿을 수 있게 시작점 기준 ±7 m 로 크게 잡는다.
      origin_x: -7.0
      origin_y: -7.0
      width: 14
      height: 14
      resolution: 0.05
      track_unknown_space: false       # 미지 영역은 '자유'로 본다(박스는 LiDAR에 곧 드러남 → 2 Hz 재계획)
      robot_radius: 0.12                # 원형 풋프린트: 계획기와 컨트롤러·복구 동작(충돌검사)이 같은 기준. 시뮬(충돌반경 0.14)에서 정한 값 — 실기는 실측
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan virtual_walls
        scan:
          topic: /scan
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          clearing: true                # ← 옮겨진 박스를 비우는 핵심
          marking: true
          obstacle_max_range: 6.0
          raytrace_max_range: 7.0
          obstacle_min_range: 0.0
          raytrace_min_range: 0.0
        virtual_walls:                  # 경기장 외벽(마킹 전용). 클리어링 후에 마킹되므로 깜빡이지 않는다.
          topic: /arena_walls_cloud
          data_type: "PointCloud2"
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0
          clearing: false
          marking: true
          obstacle_max_range: 50.0
          obstacle_min_range: 0.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0
        inflation_radius: 0.30
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.20                  # 목표가 막혀 있으면 이 반경 안의 가까운 자유점으로
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.2
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 8.0
    node_names: ["controller_server", "planner_server", "behavior_server", "bt_navigator"]
