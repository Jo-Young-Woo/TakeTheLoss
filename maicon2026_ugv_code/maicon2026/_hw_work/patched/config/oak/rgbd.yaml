# OAK-D Lite 컬러+깊이(RGBD) 프로파일 — 깊이를 쓸 때만 고른다(oak.profile: rgbd).   [실기 확인]
#
# 파라미터 이름은 depthai_ros_driver 판마다 다르다. 이 파일은 구 문서 이름이다. 확인: ros2 param list /oak
#   구 문서 (이 파일)                         v3 문서
#   camera.i_pipeline_type                   pipeline_gen.i_pipeline_type
#   rgb.i_resolution + i_isp_num / i_isp_den rgb.i_width / rgb.i_height
#   stereo.i_align_depth                     stereo.i_aligned
#   stereo.i_extended_disp                   stereo.i_extended_disp (같음)
#   stereo.i_threshold_filter_min/max_range  판에 따라 이름이 다르거나 없다 — 없으면 depth.min_range / depth.max_range 가 소프트웨어로 거른다
#
# 깊이를 컬러에 정렬하면 결과의 폭·높이가 16 의 배수여야 한다: 1280×720 은 되고(80×45 블록) 640×360 은 안 된다.
# 확장 시차(extended disparity)를 켜면 최소 거리가 약 0.8 m 에서 0.2–0.4 m 로 내려간다(대신 먼 거리 정밀도가 조금 떨어진다).
# 전력: 스테레오 +0.5 W. 깊이를 안 쓰면 rgb_lowpower 를 고른다.
/oak:
  ros__parameters:
    camera:
      i_pipeline_type: RGBD
      i_nn_type: none
      i_enable_imu: false          # OAK 의 IMU 는 끈다 — 로봇 IMU 를 쓴다
    rgb:
      i_fps: 10.0
      i_resolution: "1080"
      i_set_isp_scale: true
      i_isp_num: 2
      i_isp_den: 3                 # 1280×720 (16 의 배수)
      i_output_isp: true
      i_low_bandwidth: false
      i_publish_topic: true
    stereo:
      i_fps: 10.0
      i_align_depth: true          # 깊이를 컬러 프레임에 정렬 → 컬러와 같은 1280×720
      i_extended_disp: true        # 최소 거리를 낮춘다
      i_subpixel: false
      i_lr_check: true
      i_threshold_filter_min_range: 200     # mm — 0.2 m. [실기 확인: 이 이름이 판에 있는지]
      i_threshold_filter_max_range: 4000    # mm — 4 m (4 m 아래에서 오차 2% 미만)
