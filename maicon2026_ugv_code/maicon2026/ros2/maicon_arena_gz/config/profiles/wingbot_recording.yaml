name: wingbot_recording
# Standard physics/sensors; only this explicitly enabled observer camera differs.
physics:
  max_step_size: 0.004
  real_time_update_rate: 250
  real_time_factor: 1.0
textures: {atlas_tile_px: 512, floor_lite: false}
scene:
  ambient: [0.6, 0.6, 0.6, 1]
  background: [0.12, 0.12, 0.12, 1]
  shadows: false
  gravity: [0, 0, -9.81]
  sun:
    pose: [0, 0, 10, 0, 0, 0]
    direction: [-0.3, -0.4, -1]
    diffuse: [0.8, 0.8, 0.8, 1]
    specular: [0, 0, 0, 1]
geometry: {floor_thickness: 0.02, tower_pole_radius_scale: 0.35}
colors:
  black: [0.025, 0.025, 0.025, 1]
  pole: [0.12, 0.12, 0.12, 1]
  red: [1, 0, 0, 1]
  amber: [1, 0.45, 0, 1]
  green: [0, 1, 0, 1]
  target_idle: [0.12, 0, 0, 1]
uav_camera:
  optical_hfov: 2.2689280275926285
  mount_yaw_offset: 1.5707963267948966
  resolution: [1280, 720]
  update_rate: 1.0
  clip: [0.02, 100]
validation_camera:
  # Observer only: aim from the south at arena centre z=0.2 m; no Agent input.
  pose: [0, -6.2, 5.5, 0, 0.7072964856774628, 1.5707963267948966]
  resolution: [1280, 720]
  hfov: 1.2
  update_rate: 10.0
  clip: [0.1, 20]
ugv: {lidar_samples: 450, camera_rate: 10, lidar_rate: 10, imu_rate: 20, wheel_count: 6}
smog: {enabled: false}
