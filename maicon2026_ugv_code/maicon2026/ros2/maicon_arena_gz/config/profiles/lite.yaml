name: lite
# Simulation/render defaults are assumptions; arena coordinates remain in arena_spec.yaml.
physics:
  max_step_size: 0.004
  real_time_update_rate: 250
  real_time_factor: 1.0
textures: {atlas_tile_px: 256, floor_lite: true}
scene:
  ambient: [0.6, 0.6, 0.6, 1]
  background: [0.12, 0.12, 0.12, 1]
  shadows: false
  gravity: [0, 0, -9.81] # assumed terrestrial gravity
  sun:
    pose: [0, 0, 10, 0, 0, 0] # assumed, not an arena device
    direction: [-0.3, -0.4, -1]
    diffuse: [0.8, 0.8, 0.8, 1]
    specular: [0, 0, 0, 1]
geometry: {floor_thickness: 0.02, tower_pole_radius_scale: 0.35} # assumed
colors:
  black: [0.025, 0.025, 0.025, 1]
  pole: [0.12, 0.12, 0.12, 1]
  red: [1, 0, 0, 1]
  amber: [1, 0.45, 0, 1]
  green: [0, 1, 0, 1]
  target_idle: [0.12, 0, 0, 1]
uav_camera:
  optical_hfov: 2.2689280275926285 # assumed 130deg: includes raised walls/corner boxes at 2.5m
  mount_yaw_offset: 1.5707963267948966 # assumed optical mount: screen right +X, up +Y
  resolution: [960, 540]
  update_rate: 1.0
  clip: [0.02, 100] # assumed
validation_camera:
  pose: [0, 0, 6, 0, 1.5707963267948966, 1.5707963267948966] # assumed validation-only viewpoint
  resolution: [1500, 1200]
  hfov: 1.0472
  update_rate: 1.0
  clip: [0.1, 20]
ugv: {lidar_samples: 360, camera_rate: 5, lidar_rate: 5, imu_rate: 5, wheel_count: 2}
smog: {enabled: false} # no particles by default, including high






