# =====================================================================
# WINGBOT-UGV 모델 수정값 v2 — ugv_rover(Waveshare ugv_ws) 기준 추가·변경 사항
# 좌표: base_footprint 기준(관절 0일 때), +x 앞, +y 왼쪽, +z 위, 지면 z=0. 단위 m, rad
# 근거 표기
#   base   = ugv_rover URDF/STL에서 계산
#   photo  = 1차 자료 p21 사진(원본 1057x1054)을 카메라 역산으로 3D 복원
#            (차체 실루엣 IoU 0.95로 카메라 자세·초점 추정 → 점 대응·대칭쌍 삼각측량. 재투영 오차를 함께 적음)
#   spec   = 문서 수치 · assumed = 추정, 현장 실측으로 교체
# 사진 시점: 앞-오른쪽(방위 -41°), 거의 수평(앙각 9°), 망원(f 3765 px, 거리 1.2 m)
# =====================================================================
base_model:
  source: ugv_ws/src/ugv_main/ugv_description/urdf/ugv_rover.urdf   # meshes/ugv_rover/*.stl
  bbox_lwh: [0.251, 0.230, 0.254]      # base: 대회 사양 '250(가로) x 230(세로)'과 일치 → 가로=길이(x), 세로=폭(y)
  deck_top_z: 0.120                    # base
  photo_fit_check: "깊이 카메라 양끝 photo (0.090, ±0.049, 0.104) vs base (0.083, ±0.045, 0.102); 라이다 윗면 photo가 약 9 mm 낮음 — 차체는 base 그대로 써도 1 cm 이내"
  known_bugs:
    - "models/ugv_rover/model.sdf 의 diff_drive wheel_diameter 0.05 — 실제 바퀴 지름 0.08(STL). 그대로 쓰면 속도·오도메트리가 1.6배 틀린다"
    - "모든 충돌체가 STL 메시 → 기본 도형으로 교체(성능)"
    - "카메라 hfov 1.03 rad·30 Hz, 라이다 0.16~3.5 m·360점은 TurtleBot 기본값 — 대회 사양으로 교체"
    - "Gazebo Classic(gazebo_ros) 플러그인 → Fortress 시스템으로 이식"
target_spec:                           # spec (1차 p21)
  size_lwh: [0.250, 0.230, 0.320]      # spec. 사진 복원 최고점은 안테나 끝 ≈0.28 — 320과 4 cm 차이(현장 확인: 안테나 길이·각도 차이 가능)
  mass_total: 2.9
  drive: 6WD
wheels:
  radius: 0.040                        # base (STL 지름 0.080)
  width: 0.043                         # base
  y: 0.08726                           # base
  z: 0.0388                            # base
  x: [0.0855, 0.0, -0.0855]            # 앞·가운데·뒤. 가운데 한 쌍은 photo(옆에서 3개) — 베이스 URDF에 없음, 추가
  middle_pair_added: true
pan_tilt:                              # base 관절 그대로, 한계만 대회 사양으로
  pan_joint: pt_base_link_to_pt_link1  # 축 (0,0,-1) → 관절각 + = 오른쪽 = API pan +
  tilt_joint: pt_link1_to_pt_link2     # 축 = pt_link1의 -y → 관절각 + = 위 = API tilt +
  pan_limit_rad: 0.8727                # spec: ±100 단위 × 0.5° = ±50°
  tilt_limit_rad: 0.2618               # spec: ±100 단위 × 0.15° = ±15°
  max_speed_rad_s: 4.71                # spec: 270 °/s
  photo_fit_check: "base 팬틸트 메시를 사진 카메라로 투영하면 사진의 마스트·U브래킷·하우징 위치와 겹침"
laser_emitter:                         # photo: '레이저 발광부' = 머리 맨 위 팔각 단면 상자, 앞면 전체가 큰 렌즈 베젤
  parent: pt_link2                     # 틸트·팬과 함께 움직임
  frame: laser_link                    # 새 링크(고정 관절). x = 레이저 광축
  lens_xyz: [0.048, 0.000, 0.250]      # photo: 앞면 베젤 중심, 재투영 1.7 px
  housing:
    center: [0.0195, 0.000, 0.250]     # photo: 앞면 x 0.048 · 뒤끝 x -0.009 · 윗면 z 0.264 · 아랫면 z 0.236
    size: [0.057, 0.030, 0.028]        # photo: 길이·폭·높이 (폭은 대칭쌍 |y| 0.015)
    chamfer: 0.006                     # 팔각 단면(모서리 깎임)
    clamp_ring_x: [-0.005, 0.001]      # photo: 뒤쪽 고정 링
  bezel: {radius: 0.011, depth: 0.003} # photo: 지름 약 0.022
  glass: {radius: 0.005}
  boresight_offset_from_camera: [-0.009, 0.000, 0.0465]   # 레이저 렌즈 - 카메라 렌즈. 조준 보정 시험의 핵심 값 — 현장 실측으로 교체
camera:                                # photo: 레이저 상자 아래 작은 보드 카메라(위에 흰 LED, 아래 황동 렌즈 받침)
  parent: pt_link2
  frame: pt_camera_link                # base 링크 이름 유지. 관절 z를 0.0065 낮춰 렌즈를 사진 위치로
  lens_xyz: [0.057, 0.000, 0.2035]     # photo (y=0 가정). 보드 평면 x=0.050 가정이면 y=+0.007
  board: {center: [0.050, 0.000, 0.212], size: [0.004, 0.028, 0.034]}
  barrel: {radius: 0.006, length: 0.008}
  led: {center: [0.052, -0.004, 0.2216], radius: 0.0045}   # photo: 흰 LED(빛 없음, 흰 재질만)
  hfov_rad: 2.0                        # assumed: 160° 렌즈 → 일반 camera + 왜곡 근사, 실측 후 교체
  resolution: [640, 480]
  rate_hz: 10
receivers:                             # photo: '레이저 수광센서(좌/우)' = 좌·우 측면 가운데의 흰 확산 돔(검은 받침 안쪽)
  left:  {center: [0.005,  0.103, 0.122], facing: [0.0,  1.0, 0.27]}   # photo 대칭쌍 재투영 14 px. 바깥(±y)·위로 15°
  right: {center: [0.005, -0.103, 0.122], facing: [0.0, -1.0, 0.27]}
  dome_radius: 0.0225                  # photo: 보이는 폭 0.042 m
  dome_height_ratio: 0.65              # photo: 반구보다 납작한 확산 캡
  skirt_height: 0.010                  # 돔 아래 원통 부분
  photo_fit: "개별 복원 가까운 쪽 z 0.119·먼 쪽 z 0.128 → 0.122. 윤곽 겹침으로 위 기울기 15° 선택"
  mount_box: [0.034, 0.018, 0.030]     # 돔 안쪽 검은 받침(차체 쪽)
  acceptance: hemisphere               # 판정: 레이저 광선이 돔 구를 지나고 차체에 가리지 않으면 수광 (2 s 연속 = 피격)
iff_antennas:                          # photo: '피아식별(안테나 구조물 색상)' = 돔 뒤 안쪽에서 바깥으로 꺾인 관절 + 수직 막대 + 팀 색 슬리브
  left:  {base: [-0.040,  0.090, 0.125], bend: [-0.040,  0.107, 0.141]}
  right: {base: [-0.040, -0.090, 0.125], bend: [-0.040, -0.107, 0.141]}
  hinge_radius: 0.006
  rod_radius: 0.0045
  tip_z: 0.280                         # photo: 먼 쪽 안테나 수직 적합(재투영 7 px) 끝 0.281. spec 높이 320과 차이 — 현장 확인
  sleeve: {radius: 0.0085, z: [0.190, 0.244], bands_z: [0.219, 0.226], band_height: 0.003, band_color: black}
  team_color: {BLUE: [0.10, 0.35, 1.00], RED: [0.90, 0.08, 0.08]}
  lean: {left: [0.0, 0.0], right: [0.0, 0.0]}   # [기울기 rad, 방위 rad(0=+x)]. 기본 수직
  note: "좌표는 먼 쪽(+y) 안테나의 수직 복원(재투영 7 px)을 대칭으로 쓴 값. 사진의 가까운 쪽(-y) 안테나는 관절·슬리브 자세가 달라(슬리브가 더 아래, 막대 기울어짐) 한 장으로 복원되지 않는다 — 현장 실측. 드론 추적이 이 색과 높이를 쓴다"
plaque:                                # photo: 앞 범퍼의 은색 명판 '2026 국방AI경진대회'. 사진 복원 x 0.108~0.114 — 대회 범퍼가 STL(앞면 0.123)보다 약 1.5 cm 짧음. 시각 요소라 STL 범퍼 면에 붙임
  center: [0.1255, 0.000, 0.0557]
  size: [0.003, 0.122, 0.026]
  pitch: 0.23                          # 위가 뒤로 약 13°
  color: [0.82, 0.82, 0.84]
headlights:                            # photo: 깊이 카메라 양옆 흰 전조등(빛 없음, 흰 재질만)
  centers: [[0.077, 0.060, 0.097], [0.077, -0.060, 0.097]]
  radius: 0.007
pan_mast:                              # photo: 팬 유닛 아래 검은 원통 + 크롬 링 + 크롬 기둥 4개 (base의 pt_base_link 상자를 덮는 시각 요소)
  center_xy: [-0.0083, 0.000]          # base 팬 축
  cylinder: {radius: 0.0300, z: [0.122, 0.155]}
  ring: {radius: 0.0326, z: [0.155, 0.165], color: [0.75, 0.76, 0.78]}   # photo: 링 지름 0.065, z 0.155~0.165
  pillars: {count: 4, radius: 0.0025, ring_radius: 0.034, z: [0.122, 0.157], color: [0.70, 0.71, 0.73]}
lidar:                                 # photo: 마스트 앞 원통. 위치는 base, 높이는 사진에 맞춰 10 mm 낮춤(윗면 재투영 36 px → 0)
  frame: base_lidar_link
  z_offset_from_base: -0.010           # photo: 스캔 평면 약 0.13 m
  model: D500
  range: [0.02, 12.0]                  # assumed(D500 계열)
  samples: 450                         # assumed
  rate_hz: 10
  crop_deg: [225.0, 315.0]             # base: ugv_ws ldlidar 런치의 잘라 내기(마스트·안테나 가림 추정). 프레임 방향은 실기 /scan으로 확인
depth_camera: {frame: 3d_camera_link, model: OAK-D-Lite, enabled: false}
imu: {frame: base_imu_link, rate_hz: 20}
collision_primitives:                  # 성능: 메시 충돌 금지
  chassis_box: {center: [0.0, 0.0, 0.080], size: [0.245, 0.130, 0.080]}
  deck_box:    {center: [0.0, 0.0, 0.110], size: [0.245, 0.200, 0.020]}
  head_box:    {parent: pt_link2, center: [0.018, 0.0, 0.232], size: [0.080, 0.050, 0.068]}   # 하우징+레이저 상자+카메라
  wheels: cylinder
  antennas_receivers_plaque_headlights: none   # 시각 요소만(판정은 심판이 프레임 좌표로)
mass_distribution:                     # 합계 2.9 kg (spec)
  base_link: 1.80
  wheels_each: 0.10
  pan_tilt_head: 0.35
  others: 0.15
