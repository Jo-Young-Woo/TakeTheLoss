[pytest]
# This suite uses ordinary pytest tests, not launch_testing launch descriptions.
# Humble's automatically loaded launch plugins replace Python's default Logger
# with LaunchLogger(propagate=False), disconnecting unrelated caplog assertions.
# Test actual ROS logging separately in a child process; do not reconfigure the
# application's loggers or relax any transport/redaction assertions.
addopts = -p no:launch_testing -p no:launch_ros
